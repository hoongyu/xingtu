<!-- 纸上的陈设：窗棂、竹枝。都压得很淡，是纸纹不是画面 ——
     这一页真正要被读的是十二宫里的字。

     第一版这三样是我照着印象画的，反馈是「自己画的好丑」，属实。
     找过现成的：Iconify 全库搜「censer」零命中，「incense」只有一个
     game-icons 的奇幻风图标；stock 站的矢量要么要署名要么要钱；
     Lottie 得搭一个两百多 K 的运行时，而且现成的烟多是卡通风。
     所以改成第二条路：**不照印象画，照定规画**。
     窗棂按真窗的做法用双线（木棂是有厚度的，单线画出来是坐标纸）；
     竹叶按《芥子园画传》的「个」字「介」字撇，长宽比十比一、收笔出尖，
     由脚本按角度算出来，不靠我目测；香炉换成博山炉的形制，
     承盘、短柄、豆形炉身、山形镂空盖，那个轮廓是认得出来的。 -->
<svg id="zdeco" aria-hidden="true">
  <defs>
    <pattern id="zling" width="72" height="72" patternUnits="userSpaceOnUse">
      <!-- 双线：一根木棂两条边。间距 2.5，跟真窗的比例差不多 -->
      <path d="M0 0H72 M0 2.5H72 M0 36H72 M0 38.5H72
               M0 0V72 M2.5 0V72 M36 0V72 M38.5 0V72"/>
      <!-- 四角卡子花，步步锦的做法 -->
      <path d="M9 9H23 M9 9V23 M29.5 9H15.5 M29.5 9V23
               M9 29.5H23 M9 29.5V15.5 M29.5 29.5H15.5 M29.5 29.5V15.5"
            class="zka"/>
      <path d="M45 45H59 M45 45V59 M65.5 45H51.5 M65.5 45V59
               M45 65.5H59 M45 65.5V51.5 M65.5 65.5H51.5 M65.5 65.5V51.5"
            class="zka"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#zling)"></rect>
  <g class="zbam zbam-a"></g>
  <g class="zbam zbam-b"></g>
</svg>
