# push 到 main 就部署到 Cloudflare Pages。
#
# 为什么走 Actions 而不是 Cloudflare 自带的 Git 集成：
# xingtu 这个项目是用 wrangler 直传（Direct Upload）建的，官方文档明说
# 直传项目不能改成 Git 项目，只能删了重建 —— 而重建会换掉
# xingtu-32u.pages.dev 这个子域。用 Actions 跑 wrangler，网址保住，
# 效果一样是 push 即部署。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里加：
#   CLOUDFLARE_API_TOKEN   必填。Cloudflare 后台建，权限选 Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  选填。token 只能访问一个账户时可以不填

name: 部署到 Cloudflare Pages

on:
  push:
    branches: [main]
    # 只改 README 之类的不必惊动线上
    paths:
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 下面两步不重新生成产物，只核对产物是不是跟源同步。
      # 做法是重跑一遍生成器再看 git diff：有 diff 就说明改了源没重新生成，
      # 这时候部署上去的是旧的。宁可红一次，也别把旧版本悄悄发出去。
      #
      # 生成器都是纯 Python 无依赖，且已验证幂等（同样的输入不会产生 diff）。
      - name: 核对 astrodata.json 与 scripts/ 同步
        run: |
          python scripts/build_astro.py
          if ! git diff --quiet web/astrodata.json; then
            echo "::error::astrodata.json 落后于 scripts/。本地跑 python scripts/build_astro.py 后重新提交"
            git diff --stat web/astrodata.json
            exit 1
          fi

      # 指纹漏打是最阴的一种：_headers 给 .js/.css 设了一年 immutable，
      # 漏掉的那个文件会被浏览器永久缓存住，线上改不动，而且没有任何报错。
      - name: 核对资源指纹已打全
        run: |
          python scripts/stamp.py --base https://xingtu-32u.pages.dev
          if ! git diff --quiet web/; then
            echo "::error::指纹没打全。本地跑 python scripts/stamp.py --base https://xingtu-32u.pages.dev 后重新提交"
            git diff --stat web/
            exit 1
          fi

      - name: 部署
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 锁版本。让 CI 自己挑工具版本，等于给部署路径留了个不定时的变量；
          # 要升的时候改这一行，顺手在本地跑一次同版本确认没问题。
          wranglerVersion: '4.125.0'
          command: pages deploy web --project-name xingtu --branch main
