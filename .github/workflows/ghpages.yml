# 同一份 web/ 再发一份到 GitHub Pages。
#
# 为什么要第二个落点：微信内置浏览器把整个 *.pages.dev 拦掉了 ——
# 拦截文案自己说的是「该网页所属平台可能存在被他人恶意利用」，
# 判定发生在域名层，跟本站内容无关（连最无害的 /concept 都拦）。
# 免费方案全是共享域名，换一个只是换个池子，但 GitHub Pages
# 是另一套信誉池，值得试。Cloudflare 那份不动，两边并存。
#
# 注意两处差异，别指望两个落点行为一致：
#   1. GitHub Pages 没有 _headers，缓存策略是它自己那套；
#      资源指纹照样有效，只是 immutable 那条不生效。
#   2. 没有 clean URL，访问要带 .html。站内导航本来就写的 .html，
#      所以点得通；但 /astro 这种手输的地址在这边是 404。

name: 发一份到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/ghpages.yml'
  workflow_dispatch:

concurrency:
  group: ghpages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 曾经这里要就地改写 og:image —— 那时仓库里存的绝对地址指向
      # Cloudflare，一份源发两个落点。Cloudflare 那份已经删了，
      # 仓库里存的就是本落点的地址，不必再改。留 setup-python 是因为
      # 下面没有构建步骤，但保持环境一致，将来加回来不用重新想。
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
